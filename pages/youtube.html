<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mercury YouTube Watcher</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
body {
    margin: 0;
    padding: 0;
    overflow-x: hidden;
    overflow-y: auto;
    font-family: 'Roboto', sans-serif;
    background: linear-gradient(to bottom, #0f2027, #203a43, #2c5364);
    color: #fff;
    min-height: 100vh;
}

/* Particle canvas */
canvas#particle-canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
}

/* Back button in top left */
.back-button {
    position: fixed;
    top: 20px;
    left: 20px;
    z-index: 100;
    background: rgba(255, 255, 255, 0.12);
    backdrop-filter: blur(10px);
    border-radius: 12px;
    padding: 12px 20px;
    color: white;
    text-decoration: none;
    font-size: 1rem;
    font-weight: 500;
    border: 1px solid rgba(255,255,255,0.25);
    transition: all 0.3s ease;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
}
.back-button:hover {
    background: rgba(255, 255, 255, 0.22);
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
}

/* Header */
header {
    text-align: center;
    padding: 40px 20px 20px 20px;
    position: relative;
    z-index: 1;
}
header h1 {
    font-size: 3rem;
    color: #fff;
    margin: 0;
}

/* Main content */
main {
    position: relative;
    z-index: 1;
}

/* Centered search bar */
.search-container {
    display: flex;
    justify-content: center;
    margin: 20px 0 40px 0;
}
.search-container input {
    flex: 1;
    max-width: 600px;
    padding: 14px 20px;
    font-size: 16px;
    border-radius: 30px 0 0 30px;
    border: 2px solid #007BFF;
    outline: none;
    background-color: rgba(0, 123, 255, 0.1);
    color: #fff;
    transition: 0.3s;
}
.search-container input::placeholder {
    color: rgba(255,255,255,0.7);
}
.search-container input:focus {
    background-color: rgba(0, 123, 255, 0.2);
    border-color: #0056b3;
}
.search-container button {
    padding: 14px 25px;
    font-size: 16px;
    background: linear-gradient(45deg, #007BFF, #0056b3);
    border: none;
    border-radius: 0 30px 30px 0;
    color: #fff;
    font-weight: bold;
    cursor: pointer;
    transition: background 0.3s, transform 0.2s;
}
.search-container button:hover {
    background: linear-gradient(45deg, #0056b3, #003f7f);
    transform: scale(1.05);
}

/* Player container */
.player-container {
    width: 95%;
    max-width: 1400px;
    margin: 30px auto;
    position: relative;
    padding-bottom: 56.25%;
    height: 0;
    display: none; 
}
.player-container iframe {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border: 0;
}

/* Video results grid - 5 per row */
.results {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 20px;
    width: 95%;
    max-width: 1400px;
    margin: 30px auto 60px auto;
}
.video-card {
    background-color: rgba(0,0,0,0.3);
    border-radius: 10px;
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
    display: flex;
    flex-direction: column;
    align-items: center;
}
.video-card img {
    width: 100%;
    display: block;
}
.video-card p {
    margin: 8px;
    font-size: 0.9rem;
    text-align: center;
    color: #fff;
}
.video-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 10px 20px rgba(0,0,0,0.5);
}

/* Footer */
footer {
    text-align: center;
    color: white;
    padding: 40px 20px 60px 20px;
    position: relative;
    z-index: 10;
}

/* Responsive adjustments */
@media (max-width: 768px) {
    .back-button { padding: 10px 16px; font-size: 0.9rem; }
    header h1 { font-size: 2.5rem; }
    .results { grid-template-columns: repeat(3, 1fr); }
}
@media (max-width: 480px) {
    .back-button { top: 15px; left: 15px; padding: 8px 14px; font-size: 0.85rem; }
    header h1 { font-size: 2rem; }
    .results { grid-template-columns: repeat(2, 1fr); }
    .search-container input { font-size: 14px; padding: 12px 18px; }
    .search-container button { font-size: 14px; padding: 12px 20px; }
}
</style>
</head>
<body>  
<canvas id="particle-canvas"></canvas>
<a href="../index.html" class="back-button">← Back</a>
<header>
    <h1>Mercury YouTube Watcher</h1>
</header>
<main>
    <div class="search-container">
        <input id="search" type="text" placeholder="Search YouTube...">
        <button onclick="searchVideos()">Search</button>
    </div>
    <div class="player-container">
        <iframe id="player" 
            title="YouTube video player" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
            allowfullscreen>
        </iframe>
    </div>
    <div id="results" class="results"></div>
</main>
<footer>
    <p>Powered by YouTube Data API v3</p>
</footer>

<script>
// Particles JS
const canvas = document.getElementById('particle-canvas');
const ctx = canvas.getContext('2d');
let particlesArray = [];
const maxParticles = 100;

function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

class Particle {
    constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 2 + 1;
        this.speedX = (Math.random() - 0.5) * 1;
        this.speedY = (Math.random() - 0.5) * 1;
    }
    update() {
        this.x += this.speedX;
        this.y += this.speedY;
        if(this.x<0) this.x=canvas.width;
        if(this.x>canvas.width) this.x=0;
        if(this.y<0) this.y=canvas.height;
        if(this.y>canvas.height) this.y=0;
    }
    draw() {
        ctx.fillStyle='white';
        ctx.beginPath();
        ctx.arc(this.x,this.y,this.size,0,Math.PI*2);
        ctx.fill();
    }
}

function initParticles() {
    particlesArray = [];
    for(let i=0;i<maxParticles;i++){particlesArray.push(new Particle());}
}
initParticles();

function animate() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    particlesArray.forEach(p=>{p.update();p.draw();});
    requestAnimationFrame(animate);
}
animate();
</script>

<script>
// YouTube JS with 1-minute rate limit
const API_KEY = 'AIzaSyBMOMNiDI-ASbl61gv-fecfxETRTjOznxo';
let lastSearchTime = 0; // timestamp of last search

async function searchVideos() {
    const now = Date.now();
    if (now - lastSearchTime < 60_000) { // 60 seconds = 1 minute
        alert("Please wait 1 minute before searching again to save your quota.");
        return;
    }
    lastSearchTime = now;

    const query = document.getElementById('search').value.trim();
    if (!query) return;

    const resultsDiv = document.getElementById('results');
    resultsDiv.innerHTML = '<p style="text-align:center; grid-column: span 5;">Searching...</p>';

    try {
        const response = await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&maxResults=20&q=${encodeURIComponent(query)}&key=${API_KEY}`);
        const data = await response.json();
        resultsDiv.innerHTML = '';
        if(data.items && data.items.length>0){
            data.items.forEach(item=>{
                const videoId=item.id.videoId;
                const title=item.snippet.title;
                const thumbnail=item.snippet.thumbnails.medium.url;

                const card=document.createElement('div');
                card.className='video-card';
                card.innerHTML=`<img src="${thumbnail}" alt="${title}"><p>${title}</p>`;
                card.onclick=()=>playVideo(videoId);
                resultsDiv.appendChild(card);
            });
        } else {
            resultsDiv.innerHTML='<p style="text-align:center; grid-column: span 5;">No results found.</p>';
        }
    } catch(err) {
        resultsDiv.innerHTML='<p style="text-align:center; grid-column: span 5;">Error fetching videos. Try again later.</p>';
        console.error(err);
    }
}

function playVideo(videoId){
    const playerContainer=document.querySelector('.player-container');
    const player=document.getElementById('player');
    player.src=`https://www.youtube-nocookie.com/embed/${videoId}?autoplay=1`;
    playerContainer.style.display='block';
    window.scrollTo({top:0,behavior:'smooth'});
}

// Enter key triggers search
document.getElementById('search').addEventListener('keydown', e=>{
    if(e.key==='Enter') searchVideos();
});
</script>
</body>
</html>
