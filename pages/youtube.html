<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mercury YouTube Watcher</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Body styling */
body {
    margin: 0;
    padding: 0;
    font-family: 'Roboto', sans-serif;
    background: linear-gradient(to bottom, #0f2027, #203a43, #2c5364);
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
}

/* Particle canvas */
#particle-canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    pointer-events: none;
}

/* Header */
header {
    text-align: center;
    margin: 40px 0 20px 0;
    position: relative;
    z-index: 10;
}

header h1 {
    font-size: 5rem;
    color: white;
    text-shadow: 0 0 10px #fff, 0 0 20px #fff;
    margin: 0;
}

/* Search bar */
.search-container {
    display: flex;
    margin: 30px 0;
}

.search-container input {
    flex: 1;
    max-width: 600px;
    padding: 14px 20px;
    font-size: 16px;
    border-radius: 30px 0 0 30px;
    border: 2px solid #0062cc;
    outline: none;
    background-color: rgba(0, 98, 204, 0.2);
    color: #fff;
    transition: 0.3s;
}

.search-container input::placeholder {
    color: rgba(255,255,255,0.7);
}

.search-container input:focus {
    background-color: rgba(0, 98, 204, 0.3);
    border-color: #004a99;
}

.search-container button {
    padding: 14px 25px;
    font-size: 16px;
    background: linear-gradient(45deg, #0062cc, #004a99);
    border: none;
    border-radius: 0 30px 30px 0;
    color: #fff;
    font-weight: bold;
    cursor: pointer;
    transition: background 0.3s, transform 0.2s;
}

.search-container button:hover {
    background: linear-gradient(45deg, #004a99, #003366);
    transform: scale(1.05);
}

/* Result count selector */
.search-container select {
    padding: 14px 16px;
    font-size: 15px;
    border-top: 2px solid #0062cc;
    border-bottom: 2px solid #0062cc;
    border-left: none;
    border-right: none;
    background-color: rgba(0, 98, 204, 0.2);
    color: white;
    outline: none;
    cursor: pointer;
}

.search-container select option {
    color: black;
}

/* Player container */
.player-container {
    width: 90%;
    max-width: 900px;
    margin-bottom: 50px;
    display: none; /* hidden initially */
}

.player-container iframe {
    width: 100%;
    height: 500px;
    border: 0;
}

/* Results styling */
.results {
    width: 90%;
    max-width: 900px;
    margin-bottom: 50px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 20px;
}

.video-card {
    background-color: rgba(0,0,0,0.3);
    border-radius: 10px;
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
    display: flex;
    flex-direction: column;
    align-items: center;
}
.video-card img {
    width: 100%;
    display: block;
}
.video-card p {
    margin: 8px;
    font-size: 0.9rem;
    text-align: center;
    color: #fff;
}
.video-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 10px 20px rgba(0,0,0,0.5);
}

/* Footer */
footer {
    margin-bottom: 30px;
    font-size: 0.9rem;
    text-align: center;
    color: rgba(255,255,255,0.7);
}

/* Responsive title sizes */
@media (max-width: 768px) {
    header h1 {
        font-size: 4rem;
    }
}
@media (max-width: 480px) {
    header h1 {
        font-size: 3rem;
    }
}
</style>
</head>
<body>
<canvas id="particle-canvas"></canvas>
<a href="../index.html" class="back-button">← Back</a>
<header>
    <h1>Mercury YouTube Watcher</h1>
</header>

<main>
    <div class="search-container">
        <input id="search" type="text" placeholder="Search YouTube...">
        <select id="resultCount">
            <option value="1">1</option>
            <option value="5">5</option>
            <option value="10">10</option>
            <option value="20" selected>20</option>
            <option value="50">50</option>
        </select>
        <button onclick="searchVideos()">Search</button>
    </div>

    <div class="player-container">
        <iframe id="player" title="YouTube video player" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
    </div>

    <div id="results" class="results"></div>
</main>

<footer>
    <p>Powered by YouTube Data API v3</p>
</footer>

<script>
// Particles JS
const canvas = document.getElementById('particle-canvas');
const ctx = canvas.getContext('2d');
let particlesArray = [];
const maxParticles = 100;

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

class Particle {
    constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 2 + 1;
        this.speedX = (Math.random() - 0.5) * 1;
        this.speedY = (Math.random() - 0.5) * 1;
    }
    update() {
        this.x += this.speedX;
        this.y += this.speedY;
        if (this.x < 0) this.x = canvas.width;
        if (this.x > canvas.width) this.x = 0;
        if (this.y < 0) this.y = canvas.height;
        if (this.y > canvas.height) this.y = 0;
    }
    draw() {
        ctx.fillStyle = 'white';
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
    }
}

function initParticles() {
    particlesArray = [];
    for (let i = 0; i < maxParticles; i++) {
        particlesArray.push(new Particle());
    }
}
initParticles();

function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particlesArray.forEach(p => {
        p.update();
        p.draw();
    });
    requestAnimationFrame(animate);
}
animate();
</script>

<script>
// YouTube JS
const API_KEY = 'AIzaSyBMOMNiDI-ASbl61gv-fecfxETRTjOznxo';

async function searchVideos() {
    const query = document.getElementById('search').value.trim();
    if (!query) return;

    const maxResults = document.getElementById('resultCount').value;
    const resultsDiv = document.getElementById('results');
    resultsDiv.innerHTML = '<p style="text-align:center;">Searching...</p>';

    try {
        const response = await fetch(
            `https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&maxResults=${maxResults}&q=${encodeURIComponent(query)}&key=${API_KEY}`
        );
        const data = await response.json();

        resultsDiv.innerHTML = '';
        if (data.items && data.items.length > 0) {
            data.items.forEach(item => {
                const videoId = item.id.videoId;
                const title = item.snippet.title;
                const thumbnail = item.snippet.thumbnails.medium.url;

                const card = document.createElement('div');
                card.className = 'video-card';
                card.innerHTML = `
                    <img src="${thumbnail}" alt="${title}">
                    <p>${title}</p>
                `;
                card.onclick = () => playVideo(videoId);
                resultsDiv.appendChild(card);
            });
        } else {
            resultsDiv.innerHTML = '<p style="text-align:center;">No results found.</p>';
        }
    } catch (err) {
        resultsDiv.innerHTML = '<p style="text-align:center;">Error fetching videos.</p>';
        console.error(err);
    }
}

function playVideo(videoId) {
    const player = document.getElementById('player');
    const playerContainer = document.querySelector('.player-container');

    player.src = `https://www.youtube-nocookie.com/embed/${videoId}?autoplay=1`;
    playerContainer.style.display = 'block';

    window.scrollTo({ top: 0, behavior: 'smooth' });
}

// Enter key triggers search
document.getElementById('search').addEventListener('keydown', e => {
    if (e.key === 'Enter') searchVideos();
});
</script>
</body>
</html>
