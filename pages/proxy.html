<!DOCTYPE html>
<html>
<head>
    <title>Mercury Proxy</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #1a1a1a;
            color: white;
        }
        #search-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        #url-input {
            width: 70%;
            padding: 12px;
            font-size: 16px;
            border: 2px solid #333;
            border-radius: 5px 0 0 5px;
            background: #2a2a2a;
            color: white;
        }
        #go-button {
            width: 28%;
            padding: 12px;
            font-size: 16px;
            border: 2px solid #333;
            border-left: none;
            border-radius: 0 5px 5px 0;
            background: #4CAF50;
            color: white;
            cursor: pointer;
        }
        #go-button:hover {
            background: #45a049;
        }
        #proxy-frame {
            width: 100%;
            height: calc(100vh - 120px);
            border: none;
            margin-top: 20px;
            border-radius: 5px;
        }
        #status {
            max-width: 800px;
            margin: 10px auto;
            padding: 10px;
            text-align: center;
            font-size: 14px;
            color: #888;
        }
        #status.ready {
            color: #4CAF50;
        }
        #status.error {
            color: #f44336;
        }
    </style>
</head>
<body>
    <div id="status">Initializing proxy...</div>
    <div id="search-container">
        <input type="text" id="url-input" placeholder="Enter URL (e.g., google.com)">
        <button id="go-button" onclick="loadProxy()">Go</button>
    </div>
    <iframe id="proxy-frame"></iframe>

    <script src="/uv/uv.bundle.js"></script>
    <script src="/uv.config.js"></script>
    <script>
        // Register the service worker FIRST when page loads
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', async () => {
                try {
                    const registration = await navigator.serviceWorker.register('/uv/uv.sw.js', {
                        scope: '/service/'
                    });
                    console.log('Service Worker registered successfully:', registration.scope);
                    document.getElementById('status').textContent = 'Proxy ready!';
                    document.getElementById('status').className = 'ready';
                    
                    // Wait for service worker to be active
                    if (registration.active) {
                        console.log('Service Worker is active');
                    } else {
                        await navigator.serviceWorker.ready;
                        console.log('Service Worker is now ready');
                    }
                } catch (error) {
                    console.error('Service Worker registration failed:', error);
                    document.getElementById('status').textContent = 'Proxy initialization failed. Check console for details.';
                    document.getElementById('status').className = 'error';
                }
            });
        } else {
            document.getElementById('status').textContent = 'Service Workers not supported in this browser.';
            document.getElementById('status').className = 'error';
        }

        function loadProxy() {
            let url = document.getElementById('url-input').value.trim();
            
            // Add https:// if no protocol specified
            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                url = 'https://' + url;
            }
            
            const frame = document.getElementById('proxy-frame');
            const encodedUrl = __uv$config.encodeUrl(url);
            frame.src = __uv$config.prefix + encodedUrl;
        }
        
        // Allow Enter key to submit
        document.getElementById('url-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                loadProxy();
            }
        });
    </script>
</body>
</html>
