<script>
    const chatMessages = document.getElementById('chatMessages');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const typingIndicator = document.getElementById('typingIndicator');

    // Make sure your key is inside these quotes
    const apiKey = 'YOUR_GOOGLE_API_KEY_HERE';
    let conversationHistory = [];

    messageInput.focus();

    async function sendMessage() {
        const message = messageInput.value.trim();
        if (!message) return;

        addMessage(message, 'user');
        messageInput.value = '';
        sendBtn.disabled = true;
        typingIndicator.classList.add('active');

        conversationHistory.push({
            role: "user",
            content: message
        });

        try {
            // FIX: Added ?key= to the URL and removed Authorization header
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/openai/chat/completions?key=${apiKey}`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    model: "gemini-2.0-flash-lite-preview-02-05", 
                    messages: conversationHistory,
                    temperature: 0.7,
                    max_tokens: 1024
                })
            });

            typingIndicator.classList.remove('active');

            if (!response.ok) {
                const errorData = await response.json();
                addMessage("Error: " + (errorData.error?.message || response.statusText), 'assistant');
                sendBtn.disabled = false;
                return;
            }

            const data = await response.json();
            const reply = data.choices[0].message.content;
            
            addMessage(reply, 'assistant');
            
            conversationHistory.push({
                role: "assistant",
                content: reply
            });

            if (conversationHistory.length > 20) {
                conversationHistory = conversationHistory.slice(-20);
            }

        } catch (error) {
            typingIndicator.classList.remove('active');
            addMessage("Connection error. Check your API Key.", 'assistant');
            console.error('Error:', error);
        }

        sendBtn.disabled = false;
        messageInput.focus();
    }

    function addMessage(text, sender) {
        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${sender}`;
        const contentDiv = document.createElement('div');
        contentDiv.className = 'message-content';
        contentDiv.textContent = text;
        messageDiv.appendChild(contentDiv);
        chatMessages.appendChild(messageDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    sendBtn.addEventListener('click', sendMessage);
    messageInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage();
    });
</script>
