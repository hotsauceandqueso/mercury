<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mercury AI Chat</title>
    <!-- Keep your existing CSS link or style block here -->
    <style>
        /* This ensures your layout stays exactly as it was in your screenshot */
        .active { display: block !important; }
    </style>
</head>
<body>

    <!-- This matches the structure from your screenshots -->
    <div class="chat-container">
        <div id="chatMessages" class="chat-messages">
            <div class="message assistant">
                <div class="message-content">Hello! I'm your AI assistant. Ask me anything!</div>
            </div>
        </div>
        
        <div id="typingIndicator" style="display: none;">AI is thinking...</div>

        <div class="input-area">
            <input type="text" id="messageInput" placeholder="Type your message...">
            <button id="sendBtn">Send</button>
        </div>
    </div>

    <script>
        // Use the key you provided
        const apiKey = 'AIzaSyDTR_kTl1ccyCB7FXTCzqXTKS_IwskuDU8';
        let conversationHistory = [];

        // Wait for the page to load so elements aren't "null"
        document.addEventListener('DOMContentLoaded', () => {
            const chatMessages = document.getElementById('chatMessages');
            const messageInput = document.getElementById('messageInput');
            const sendBtn = document.getElementById('sendBtn');
            const typingIndicator = document.getElementById('typingIndicator');

            if (messageInput) messageInput.focus();

            async function sendMessage() {
                const message = messageInput.value.trim();
                if (!message) return;

                // 1. Add user message to UI
                addMessage(message, 'user');
                messageInput.value = '';
                sendBtn.disabled = true;
                if (typingIndicator) typingIndicator.style.display = 'block';

                // 2. Update history
                conversationHistory.push({ role: "user", content: message });

                try {
                    // 3. Call Gemini API
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/openai/chat/completions?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            model: "gemini-2.0-flash-lite-preview-02-05", 
                            messages: conversationHistory,
                            temperature: 0.7
                        })
                    });

                    if (typingIndicator) typingIndicator.style.display = 'none';

                    if (!response.ok) {
                        const errorData = await response.json();
                        addMessage("Error: " + (errorData.error?.message || "Check API status"), 'assistant');
                        return;
                    }

                    const data = await response.json();
                    const reply = data.choices[0].message.content;
                    
                    // 4. Show AI response
                    addMessage(reply, 'assistant');
                    conversationHistory.push({ role: "assistant", content: reply });

                } catch (error) {
                    if (typingIndicator) typingIndicator.style.display = 'none';
                    addMessage("Connection error. Check console.", 'assistant');
                    console.error('Error:', error);
                } finally {
                    sendBtn.disabled = false;
                    messageInput.focus();
                }
            }

            function addMessage(text, sender) {
                const messageDiv = document.createElement('div');
                messageDiv.className = `message ${sender}`;
                const contentDiv = document.createElement('div');
                contentDiv.className = 'message-content';
                contentDiv.textContent = text;
                messageDiv.appendChild(contentDiv);
                chatMessages.appendChild(messageDiv);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }

            // Event Listeners
            sendBtn.addEventListener('click', sendMessage);
            messageInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') sendMessage();
            });
        });
    </script>
</body>
</html>
