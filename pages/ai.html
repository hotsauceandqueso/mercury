<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mercury AI</title>
    <!-- Add your CSS here -->
</head>
<body>

    <!-- Ensure these IDs match exactly what is in your HTML -->
    <div id="chatMessages"></div>
    <div id="typingIndicator"></div>
    <input type="text" id="messageInput" placeholder="Type a message...">
    <button id="sendBtn">Send</button>

    <script>
        // Wrap everything in an event listener to prevent "null" errors
        document.addEventListener('DOMContentLoaded', () => {
            const chatMessages = document.getElementById('chatMessages');
            const messageInput = document.getElementById('messageInput');
            const sendBtn = document.getElementById('sendBtn');
            const typingIndicator = document.getElementById('typingIndicator');

            const apiKey = 'YOUR_GOOGLE_API_KEY'; 
            let conversationHistory = [];

            if (messageInput) messageInput.focus();

            async function sendMessage() {
                const message = messageInput.value.trim();
                if (!message) return;

                addMessage(message, 'user');
                messageInput.value = '';
                sendBtn.disabled = true;
                if (typingIndicator) typingIndicator.classList.add('active');

                conversationHistory.push({ role: "user", content: message });

                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/openai/chat/completions?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            model: "gemini-2.0-flash-lite-preview-02-05", 
                            messages: conversationHistory,
                            temperature: 0.7
                        })
                    });

                    if (typingIndicator) typingIndicator.classList.remove('active');

                    if (!response.ok) {
                        const errorData = await response.json();
                        addMessage("Error: " + (errorData.error?.message || response.statusText), 'assistant');
                        return;
                    }

                    const data = await response.json();
                    const reply = data.choices[0].message.content;
                    addMessage(reply, 'assistant');
                    conversationHistory.push({ role: "assistant", content: reply });

                } catch (error) {
                    if (typingIndicator) typingIndicator.classList.remove('active');
                    addMessage("Connection error.", 'assistant');
                    console.error('Error:', error);
                } finally {
                    sendBtn.disabled = false;
                    messageInput.focus();
                }
            }

            function addMessage(text, sender) {
                const messageDiv = document.createElement('div');
                messageDiv.className = `message ${sender}`;
                const contentDiv = document.createElement('div');
                contentDiv.className = 'message-content';
                contentDiv.textContent = text;
                messageDiv.appendChild(contentDiv);
                chatMessages.appendChild(messageDiv);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }

            sendBtn.addEventListener('click', sendMessage);
            messageInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') sendMessage();
            });
        });
    </script>
</body>
</html>
