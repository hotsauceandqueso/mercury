<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mercury AI Chat</title>
    <style>
        /* Mercury Theme Styles */
        body { background-color: #2c3e50; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; color: white; }
        .chat-container { background-color: #34495e; width: 600px; height: 550px; border-radius: 15px; display: flex; flex-direction: column; box-shadow: 0 10px 30px rgba(0,0,0,0.5); overflow: hidden; }
        .chat-header { background-color: #2c3e50; padding: 15px; text-align: center; border-bottom: 2px solid #1a252f; font-weight: bold; font-size: 1.2em; }
        #chatMessages { flex-grow: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; background-color: rgba(0,0,0,0.1); }
        .message { max-width: 80%; padding: 10px 15px; border-radius: 15px; font-size: 14px; line-height: 1.4; word-wrap: break-word; }
        .assistant { background-color: #27ae60; align-self: flex-start; color: white; }
        .user { background-color: #2980b9; align-self: flex-end; color: white; }
        .input-area { padding: 20px; background-color: #2c3e50; display: flex; gap: 10px; }
        #messageInput { flex-grow: 1; padding: 12px; border-radius: 20px; border: none; background-color: #ecf0f1; outline: none; color: #2c3e50; }
        #sendBtn { padding: 10px 20px; border-radius: 20px; border: none; background-color: #3498db; color: white; cursor: pointer; font-weight: bold; }
        #sendBtn:hover { background-color: #2980b9; }
        #typingIndicator { padding: 5px 20px; font-style: italic; font-size: 12px; color: #bdc3c7; display: none; }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">🤖 Mercury AI Chat</div>
        <div id="chatMessages">
            <div class="message assistant">Hello! I'm your AI assistant. Ask me anything!</div>
        </div>
        <div id="typingIndicator">AI is thinking...</div>
        <div class="input-area">
            <input type="text" id="messageInput" placeholder="Type your message...">
            <button id="sendBtn">Send</button>
        </div>
    </div>

    <script>
        // Your specific key from Google AI Studio
        const apiKey = 'AIzaSyDTR_kTl1ccyCB7FXTCzqXTKS_IwskuDU8';
        let conversationHistory = [];

        document.addEventListener('DOMContentLoaded', () => {
            const chatMessages = document.getElementById('chatMessages');
            const messageInput = document.getElementById('messageInput');
            const sendBtn = document.getElementById('sendBtn');
            const typingIndicator = document.getElementById('typingIndicator');

            async function sendMessage() {
                const message = messageInput.value.trim();
                if (!message) return;

                addMessage(message, 'user');
                messageInput.value = '';
                sendBtn.disabled = true;
                typingIndicator.style.display = 'block';

                conversationHistory.push({ role: "user", content: message });

                try {
                    // UPDATED: Using Gemini 2.5 Flash Lite from your rate limit list
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1/models/gemini-2.5-flash-lite:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: conversationHistory.map(msg => ({
                                role: msg.role === 'assistant' ? 'model' : 'user',
                                parts: [{ text: msg.content }]
                            }))
                        })
                    });

                    typingIndicator.style.display = 'none';
                    const data = await response.json();

                    if (!response.ok) {
                        const errorMsg = data.error?.message || "Error connecting to AI";
                        addMessage("System Error: " + errorMsg, 'assistant');
                        console.error("API Error:", data);
                        return;
                    }

                    if (data.candidates && data.candidates[0].content) {
                        const reply = data.candidates[0].content.parts[0].text;
                        addMessage(reply, 'assistant');
                        conversationHistory.push({ role: "assistant", content: reply });
                    } else {
                        addMessage("The AI didn't return a response. Try again.", 'assistant');
                    }

                } catch (error) {
                    typingIndicator.style.display = 'none';
                    addMessage("Network error. Is your VPS connected?", 'assistant');
                    console.error("Fetch Error:", error);
                } finally {
                    sendBtn.disabled = false;
                    messageInput.focus();
                    chatMessages.scrollTop = chatMessages.scrollHeight;
                }
            }

            function addMessage(text, sender) {
                const messageDiv = document.createElement('div');
                messageDiv.className = `message ${sender}`;
                messageDiv.textContent = text;
                chatMessages.appendChild(messageDiv);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }

            sendBtn.addEventListener('click', sendMessage);
            messageInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });
            messageInput.focus();
        });
    </script>
</body>
</html>
