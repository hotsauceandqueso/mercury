<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mercury AI Chat</title>
    
    <!-- 1. PASTE YOUR ORIGINAL CSS LINK OR STYLE TAGS HERE TO FIX THE LOOK -->
    <link rel="stylesheet" href="../css/style.css"> <!-- Example path, adjust if needed -->

</head>
<body>

    <!-- 2. KEEPING YOUR ORIGINAL CLASS NAMES SO YOUR CSS WORKS -->
    <div class="chat-container">
        <div id="chatMessages" class="chat-messages">
            <div class="message assistant">
                <div class="message-content">Hello! I'm your AI assistant. Ask me anything!</div>
            </div>
        </div>
        
        <div id="typingIndicator" style="display: none; color: #888; margin: 10px;">AI is thinking...</div>

        <div class="input-area">
            <input type="text" id="messageInput" placeholder="Type your message...">
            <button id="sendBtn">Send</button>
        </div>
    </div>

    <script>
        // Your specific key
        const apiKey = 'AIzaSyDTR_kTl1ccyCB7FXTCzqXTKS_IwskuDU8';
        let conversationHistory = [];

        document.addEventListener('DOMContentLoaded', () => {
            const chatMessages = document.getElementById('chatMessages');
            const messageInput = document.getElementById('messageInput');
            const sendBtn = document.getElementById('sendBtn');
            const typingIndicator = document.getElementById('typingIndicator');

            if (messageInput) messageInput.focus();

            async function sendMessage() {
                const message = messageInput.value.trim();
                if (!message) return;

                addMessage(message, 'user');
                messageInput.value = '';
                sendBtn.disabled = true;
                if (typingIndicator) typingIndicator.style.display = 'block';

                conversationHistory.push({ role: "user", content: message });

                try {
                    // FIX: Using the standard Gemini endpoint instead of the OpenAI shim to avoid 400 errors
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: conversationHistory.map(msg => ({
                                role: msg.role === 'assistant' ? 'model' : 'user',
                                parts: [{ text: msg.content }]
                            }))
                        })
                    });

                    if (typingIndicator) typingIndicator.style.display = 'none';

                    const data = await response.json();

                    if (!response.ok) {
                        addMessage("Error: " + (data.error?.message || "Check API Key"), 'assistant');
                        console.error(data);
                        return;
                    }

                    // Extracting text from the native Gemini response format
                    const reply = data.candidates[0].content.parts[0].text;
                    
                    addMessage(reply, 'assistant');
                    conversationHistory.push({ role: "assistant", content: reply });

                } catch (error) {
                    if (typingIndicator) typingIndicator.style.display = 'none';
                    addMessage("Connection error.", 'assistant');
                    console.error('Error:', error);
                } finally {
                    sendBtn.disabled = false;
                    messageInput.focus();
                }
            }

            function addMessage(text, sender) {
                const messageDiv = document.createElement('div');
                messageDiv.className = `message ${sender}`;
                const contentDiv = document.createElement('div');
                contentDiv.className = 'message-content';
                contentDiv.textContent = text;
                messageDiv.appendChild(contentDiv);
                chatMessages.appendChild(messageDiv);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }

            sendBtn.addEventListener('click', sendMessage);
            messageInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') sendMessage();
            });
        });
    </script>
</body>
</html>
