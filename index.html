<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mercury</title>
    <link rel="icon" href="favicon.ico">

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-PTNK57WP2E"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-PTNK57WP2E');
    </script>

    <!-- Fonts & CSS -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="style/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Roboto', sans-serif;
            background: #111;
            color: white;
            overflow-x: hidden;
        }

        header h1 {
            text-align: center;
            font-size: 5rem;
            margin: 40px 0 20px 0;
            text-shadow: 0 0 10px #fff, 0 0 20px #fff;
        }

        main {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            margin-top: 60px;
        }

        .button-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            justify-content: center;
        }

        .hub-button {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(10px);
            padding: 20px 40px;
            border-radius: 20px;
            text-decoration: none;
            color: white;
            font-size: 1.2rem;
            font-weight: 500;
            transition: 0.3s ease-in-out;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .hub-button:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.25);
        }

        footer {
            text-align: center;
            margin: 60px 0 40px 0;
        }

        /* Particle canvas */
        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        /* Info bar */
        #info-bar {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 300px;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            border-radius: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            color: white;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            z-index: 9999;
            opacity: 0;
            animation: fadeIn 1s forwards;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        @media (max-width: 768px) {
            header h1 { font-size: 3.5rem; }
            .hub-button { padding: 15px 30px; font-size: 1rem; }
        }

        @media (max-width: 480px) {
            header h1 { font-size: 2.5rem; }
            .hub-button { padding: 12px 25px; font-size: 0.9rem; }
            #info-bar { width: 260px; font-size: 12px; }
        }
    </style>
</head>
<body>

    <!-- Particle background -->
    <canvas id="particle-canvas"></canvas>

    <!-- Header -->
    <header>
        <h1>Mercury</h1>
    </header>

    <!-- Main buttons -->
    <main>
        <div class="button-grid">
            <a href="pages/youtube.html" class="hub-button">Mercury YouTube Matcher</a>
            <a href="games/games.html" class="hub-button">Games</a>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <p>© 2025 Mercury. All rights reserved.</p>
    </footer>

    <!-- Info bar -->
    <div id="info-bar">
        <span id="battery"></span>
        <span id="time"></span>
    </div>

    <!-- Scripts -->
    <script src="particles.js"></script>
    <script src="homepage.js"></script>
    <script src="infobar.js"></script>

</body>
</html>
