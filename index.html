<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Mercury</title>
    <link rel="icon" href="favicon.ico">
    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-PTNK57WP2E"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-PTNK57WP2E');
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        /* Reset & fonts */
        body, html {
            margin: 0;
            padding: 0;
            font-family: 'Roboto', sans-serif;
            height: 100%;
            overflow: hidden;
            background: linear-gradient(to bottom, #0f2027, #203a43, #2c5364);
            color: #fff;
            position: relative;
        }

        /* Particle canvas */
        canvas#particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* Top right logo */
        .top-right-logo {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 2;
            width: 60px;
            height: 60px;
        }

        .top-right-logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Header */
        header {
            text-align: center;
            padding: 40px 20px 20px 20px;
            position: relative;
            z-index: 1;
        }

        header h1 {
            font-size: 6.5rem;
            margin: 0 0 10px 0;
            text-shadow: 0 0 10px #fff, 0 0 20px #fff;
            font-weight: 700;
        }

        header p {
            font-size: 1.3rem;
            margin: 0;
            opacity: 0.8;
            font-weight: 400;
            letter-spacing: 1px;
        }

        /* Main container */
        main {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            flex-direction: column;
            position: relative;
            z-index: 1;
            height: calc(100% - 200px);
            padding-top: 60px;
        }

        /* Homepage button grid */
        .button-grid {
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: center;
            width: 100%;
            flex-wrap: wrap;
        }

        .button-row {
            display: flex;
            gap: 20px;
            justify-content: center;
            width: 100%;
        }

        /* Buttons */
        .hub-button, .game-button {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px 35px;
            background-color: rgba(255,255,255,0.12);
            color: #fff;
            font-size: 1.2rem;
            text-decoration: none;
            border-radius: 20px;
            font-weight: 500;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            backdrop-filter: blur(5px);
            text-align: center;
            width: 100%;
            max-width: 280px;
            height: 160px;
        }

        .hub-button:hover, .game-button:hover {
            background-color: rgba(255,255,255,0.2);
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            header h1 {
                font-size: 4.5rem;
            }
            header p {
                font-size: 1.1rem;
            }
            .button-grid {
                flex-direction: column;
            }
            .button-row {
                flex-direction: column;
            }
            .hub-button, .game-button {
                max-width: 220px;
                height: 180px;
                padding: 25px;
                font-size: 1.1rem;
            }
        }

        @media (max-width: 480px) {
            header h1 {
                font-size: 3.5rem;
            }
            header p {
                font-size: 1rem;
            }
            .hub-button, .game-button {
                max-width: 180px;
                height: 160px;
                padding: 20px;
                font-size: 1rem;
            }
            .top-right-logo {
                width: 45px;
                height: 45px;
                top: 15px;
                right: 15px;
            }
        }
    </style>
</head>
<body>
    <!-- Particle background -->
    <canvas id="particle-canvas"></canvas>

    <!-- Top right logo -->
    <div class="top-right-logo">
        <img src="assets/icons/epy.png" alt="Epy Logo">
    </div>

    <header>
        <h1>Mercury</h1>
        <p>Anything but work</p>
    </header>

    <main>
        <div class="button-grid">
            <div class="button-row">
                <a href="pages/youtube.html" class="hub-button">Mercury YouTube Matcher</a>
                <a href="games/games.html" class="hub-button">Games</a>
            </div>
            <div class="button-row">
                <a href="pages/ai.html" class="hub-button">Mercury AI</a>
            </div>
        </div>
    </main>

    <!-- Scripts -->
    <script>
        // Particles JS
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let particlesArray = [];
        const maxParticles = 100;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 1;
                this.speedX = (Math.random() - 0.5) * 1;
                this.speedY = (Math.random() - 0.5) * 1;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x < 0) this.x = canvas.width;
                if (this.x > canvas.width) this.x = 0;
                if (this.y < 0) this.y = canvas.height;
                if (this.y > canvas.height) this.y = 0;
            }
            draw() {
                ctx.fillStyle = 'white';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function initParticles() {
            particlesArray = [];
            for (let i = 0; i < maxParticles; i++) {
                particlesArray.push(new Particle());
            }
        }
        initParticles();

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particlesArray.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
