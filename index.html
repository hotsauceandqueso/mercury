<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mercury</title>
<link rel="icon" href="favicon.ico">

<!-- Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-PTNK57WP2E"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-PTNK57WP2E');
</script>

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

<style>
/* Body & gradient background */
body {
    margin: 0;
    font-family: 'Roboto', sans-serif;
    background: linear-gradient(to bottom, #0f2027, #203a43, #2c5364);
    color: #fff;
    overflow-x: hidden;
}

/* Particle canvas */
canvas#particle-canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
}

/* Header */
header {
    text-align: center;
    padding: 60px 20px 40px 20px;
    position: relative;
    z-index: 1;
}

header h1 {
    font-size: 5rem;
    margin: 0;
    text-shadow: 0 0 10px #fff, 0 0 20px #fff;
}

header p {
    font-size: 1.2rem;
    color: #ccc;
    margin-top: 10px;
}

/* Main button grid */
.button-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 25px;
    width: 90%;
    max-width: 1000px;
    margin: 40px auto;
    justify-items: center;
    z-index: 1;
    position: relative;
}

/* Buttons */
.hub-button {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px;
    background-color: rgba(255,255,255,0.12);
    color: #fff;
    font-size: 1.2rem;
    text-decoration: none;
    border-radius: 20px;
    font-weight: 500;
    transition: all 0.3s ease;
    box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    backdrop-filter: blur(10px);
    text-align: center;
    width: 100%;
    max-width: 260px;
    height: 180px;
}

.hub-button:hover {
    background-color: rgba(255,255,255,0.2);
    transform: translateY(-5px) scale(1.02);
    box-shadow: 0 10px 20px rgba(0,0,0,0.5);
}

/* Info bar matches gradient, no weird color */
#info-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 45px;
    display: flex;
    justify-content: space-around;
    align-items: center;
    font-family: 'Roboto', sans-serif;
    font-size: 14px;
    color: white;
    background: linear-gradient(to right, #0f2027, #203a43, #2c5364);
    z-index: 9999;
}

/* Responsive adjustments */
@media (max-width: 768px) {
    header h1 { font-size: 4rem; }
    .hub-button { max-width: 180px; height: 160px; padding: 20px; }
}

@media (max-width: 480px) {
    header h1 { font-size: 3rem; }
    .hub-button { max-width: 160px; height: 140px; padding: 15px; font-size: 1rem; }
}
</style>
</head>
<body>

<!-- Particle background -->
<canvas id="particle-canvas"></canvas>

<header>
    <h1>Mercury</h1>
    <p>Welcome to your hub</p>
</header>

<main>
    <div class="button-grid">
        <a href="pages/youtube.html" class="hub-button">Mercury YouTube Matcher</a>
        <a href="games/games.html" class="hub-button">Games</a>
    </div>
</main>

<!-- Info bar -->
<div id="info-bar">
    <span id="battery"></span>
    <span id="time"></span>
</div>

<!-- Scripts -->
<script>
// ---------- PARTICLES ----------
const canvas = document.getElementById('particle-canvas');
const ctx = canvas.getContext('2d');
let particlesArray = [];
const maxParticles = 100;

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

class Particle {
    constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 2 + 1;
        this.speedX = (Math.random() - 0.5) * 1;
        this.speedY = (Math.random() - 0.5) * 1;
    }
    update() {
        this.x += this.speedX;
        this.y += this.speedY;
        if (this.x < 0) this.x = canvas.width;
        if (this.x > canvas.width) this.x = 0;
        if (this.y < 0) this.y = canvas.height;
        if (this.y > canvas.height) this.y = 0;
    }
    draw() {
        ctx.fillStyle = 'white';
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI*2);
        ctx.fill();
    }
}

function initParticles() {
    particlesArray = [];
    for (let i = 0; i < maxParticles; i++) {
        particlesArray.push(new Particle());
    }
}
initParticles();

function animate() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    particlesArray.forEach(p => { p.update(); p.draw(); });
    requestAnimationFrame(animate);
}
animate();

// ---------- INFO BAR ----------
async function updateBattery() {
    if (!navigator.getBattery) { document.getElementById("battery").textContent = "Battery: N/A"; return; }
    const battery = await navigator.getBattery();
    function refreshBattery() {
        document.getElementById("battery").textContent = `Battery: ${Math.round(battery.level*100)}%`;
    }
    battery.addEventListener("levelchange", refreshBattery);
    refreshBattery();
}
updateBattery();

function updateTime() {
    const time = new Date();
    const formatted = time.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
    document.getElementById("time").textContent = `Time: ${formatted}`;
}
setInterval(updateTime, 1000);
updateTime();
</script>

</body>
</html>
