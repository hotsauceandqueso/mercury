<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mercury</title>
<link rel="icon" href="favicon.ico">

<!-- Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-PTNK57WP2E"></script>
<script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-PTNK57WP2E');
</script>

<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

<style>
/* Body and gradient background */
body {
    margin: 0;
    font-family: 'Roboto', sans-serif;
    background: linear-gradient(to bottom, #0f2027, #203a43, #2c5364);
    color: #fff;
    overflow-x: hidden;
}

/* Particle canvas */
canvas#particle-canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
}

/* Header */
header {
    text-align: center;
    padding: 60px 20px 40px 20px;
    position: relative;
    z-index: 1;
}

header h1 {
    font-size: 5rem;
    margin: 0;
    text-shadow: 0 0 10px #fff, 0 0 20px #fff;
}

header p {
    font-size: 1.2rem;
    color: #ccc;
    margin-top: 10px;
}

/* Main buttons grid */
.button-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 25px;
    width: 90%;
    max-width: 1000px;
    margin: 40px auto;
    justify-items: center;
}

.hub-button {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px;
    background-color: rgba(255,255,255,0.12);
    color: #fff;
    font-size: 1.2rem;
    text-decoration: none;
    border-radius: 20px;
    font-weight: 500;
    transition: all 0.3s ease;
    box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    backdrop-filter: blur(5px);
    text-align: center;
    width: 100%;
    max-width: 260px;
    height: 180px;
}

.hub-button:hover {
    background-color: rgba(255,255,255,0.2);
    transform: translateY(-5px) scale(1.02);
    box-shadow: 0 10px 20px rgba(0,0,0,0.5);
}

/* Info bar matches gradient, no weird color */
#info-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 45px;
    display: flex;
    justify-content: space-around;
    align-items: center;
    font-family: 'Roboto', sans-serif;
    font-size: 14px;
    color: white;
    background: linear-gradient(to right, #0f2027, #203a43, #2c5364);
    z-index: 9999;
}

/* Responsive adjustments */
@media (max-width: 768px) {
    header h1 { font-size: 4rem; }
    .hub-button { max-width: 180px; height: 160px; padding: 20px; }
}

@media (max-width: 480px) {
    header h1 { font-size: 3rem; }
    .hub-button { max-width: 160px; height: 140px; padding: 15px; font-size: 1rem; }
}
</style>
</head>
<body>

<!-- Particle background -->
<canvas id="particle-canvas"></canvas>

<header>
    <h1>Mercury</h1>
    <p>Welcome to your hub</p>
</header>

<main>
    <div class="button-grid">
        <a href="pages/youtube.html" class="hub-button">Mercury YouTube Matcher</a>
        <a href="games/games.html" class="hub-button">Games</a>
    </div>
</main>

<!-- Info bar -->
<div id="info-bar">
    <span id="battery"></span>
    <span id="time"></span>
</div>

<!-- Scripts -->
<script src="particles.js"></script>
<script src="homepage.js"></script>
<script src="infobar.js"></script>

<script>
// Initialize particles (example, make sure particles.js is set up)
if (window.Particles) {
    Particles.init({
        selector: '#particle-canvas',
        maxParticles: 120,
        color: '#ffffff',
        connectParticles: true
    });
}
</script>

</body>
</html>
